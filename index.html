<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Finance Feed | Premium Insights</title>
    <!-- Classic Fonts from Google -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f5f0; /* Classic Beige/Cream */
            --text-dark: #1a1a1a;
            --text-light: #5a5a5a;
            --accent: #2c4a3b; /* Deep Editorial Green */
            --border: #d1cdc2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-dark); font-family: 'Inter', sans-serif; line-height: 1.6; }

        /* Top Bar & Ticker */
        .top-bar { border-bottom: 1px solid var(--border); background: #ffffff; }
        
        /* Header */
        header { text-align: center; padding: 50px 20px 30px; border-bottom: 2px solid var(--text-dark); max-width: 1200px; margin: 0 auto; }
        .logo { font-family: 'Playfair Display', serif; font-size: 3.5rem; font-weight: 700; color: var(--text-dark); letter-spacing: -1px; text-transform: uppercase; margin-bottom: 10px; }
        .tagline { font-family: 'Inter', sans-serif; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-light); }

        /* Navigation */
        nav { max-width: 1200px; margin: 0 auto; padding: 15px 20px; display: flex; justify-content: center; gap: 30px; border-bottom: 1px solid var(--border); }
        .nav-btn { background: none; border: none; font-family: 'Inter', sans-serif; text-transform: uppercase; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px; color: var(--text-dark); cursor: pointer; padding-bottom: 5px; }
        .nav-btn:hover, .nav-btn.active { border-bottom: 2px solid var(--accent); color: var(--accent); }

        /* Main Container */
        .container { max-width: 1200px; margin: 50px auto; padding: 0 20px; min-height: 60vh; }

        /* Articles Grid */
        .articles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 40px; }
        
        /* Classic Article Card */
        .card { display: flex; flex-direction: column; cursor: pointer; transition: opacity 0.3s; }
        .card:hover { opacity: 0.8; }
        .card-img { width: 100%; height: 220px; object-fit: cover; filter: grayscale(20%); margin-bottom: 15px; border: 1px solid var(--border); }
        .card-category { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); font-weight: 600; margin-bottom: 8px; }
        .card-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 600; line-height: 1.3; margin-bottom: 10px; color: var(--text-dark); }
        .card-summary { font-size: 0.95rem; color: var(--text-light); margin-bottom: 15px; flex: 1; }
        .card-date { font-size: 0.8rem; color: #888; font-style: italic; border-top: 1px solid var(--border); padding-top: 10px; }

        /* Full Article View */
        #article-view { display: none; max-width: 800px; margin: 0 auto; background: #fff; padding: 60px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        .back-btn { background: none; border: 1px solid var(--border); padding: 8px 20px; font-family: 'Inter', sans-serif; text-transform: uppercase; font-size: 0.8rem; cursor: pointer; margin-bottom: 40px; transition: 0.2s; }
        .back-btn:hover { background: var(--text-dark); color: #fff; }
        
        .article-title-main { font-family: 'Playfair Display', serif; font-size: 3rem; font-weight: 700; line-height: 1.2; margin-bottom: 20px; }
        .article-meta { font-family: 'Inter', sans-serif; font-size: 0.9rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .article-img-main { width: 100%; max-height: 500px; object-fit: cover; margin-bottom: 40px; filter: grayscale(10%); border: 1px solid var(--border); }
        .article-body { font-family: 'Playfair Display', serif; font-size: 1.2rem; line-height: 1.9; color: #222; white-space: pre-line; }

        footer { border-top: 2px solid var(--text-dark); text-align: center; padding: 40px 20px; margin-top: 80px; font-family: 'Playfair Display', serif; font-size: 1.1rem; }
    </style>
</head>
<body>

    <!-- REAL-TIME MARKET TICKER -->
    <div class="top-bar">
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
            {
              "symbols": [
                { "proName": "BSE:SENSEX", "title": "SENSEX" },
                { "proName": "NSE:NIFTY", "title": "NIFTY 50" },
                { "proName": "NSE:BANKNIFTY", "title": "BANK NIFTY" },
                { "proName": "BSE:RELIANCE", "title": "RELIANCE" }
              ],
              "showSymbolLogo": true,
              "isTransparent": true,
              "displayMode": "adaptive",
              "colorTheme": "light",
              "locale": "in"
            }
            </script>
        </div>
    </div>

    <header>
        <div class="logo">The Finance Feed</div>
        <div class="tagline">Perspective. Substance. Tomorrow.</div>
    </header>

    <nav>
        <button class="nav-btn active" onclick="filterArticles('All', this)">All News</button>
        <button class="nav-btn" onclick="filterArticles('Market News', this)">Markets</button>
        <button class="nav-btn" onclick="filterArticles('Equity Research', this)">Research</button>
        <button class="nav-btn" onclick="filterArticles('Economy', this)">Economy</button>
    </nav>

    <div class="container">
        <!-- Grid View -->
        <div id="home-view" class="articles-grid"></div>

        <!-- Single Article View -->
        <div id="article-view">
            <button class="back-btn" onclick="closeArticle()">← Back</button>
            <div id="view-tag" class="card-category" style="margin-bottom:15px;">Category</div>
            <h1 id="view-title" class="article-title-main">Title</h1>
            <div id="view-meta" class="article-meta">Date</div>
            <img id="view-img" class="article-img-main" src="" alt="Article Image" style="display:none;">
            <div id="view-content" class="article-body"></div>
        </div>
    </div>

    <footer>
        <p>Good investing begins with better questions.</p>
        <p style="font-size:0.8rem; font-family:'Inter', sans-serif; margin-top:10px; color:#888;">© 2026 THE FINANCE FEED</p>
    </footer>

    <script id="main-script">
        // ARTICLES DATABASE
        let articles = /*ARTICLES_START*/[
            {
                id: 1,
                category: "Equity Research",
                title: "How to Analyze Corporate Earnings & Operating Margins",
                imageUrl: "https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?q=80&w=1000&auto=format&fit=crop",
                date: "October 22, 2026",
                summary: "Understanding management commentary and EBITDA margins is key before investing in any manufacturing company.",
                content: "When studying publicly traded companies, looking only at the headline net profit is never enough. True equity research happens when you examine the quality of earnings and management execution.\n\n1. Operating Margins & Realization per Unit:\nAlways track whether EBITDA margins are expanding due to higher product realization or raw material tailwinds.\n\n2. Cash Conversion Cycle (CCC):\nCheck inventory days, debtor days, and working capital efficiency across quarters."
            },
            {
                id: 2,
                category: "Market News",
                title: "Q2 Corporate Earnings Season: Sectoral Trends to Watch",
                imageUrl: "https://images.unsplash.com/photo-1590283603385-17ffb3a7f29f?q=80&w=1000&auto=format&fit=crop",
                date: "October 21, 2026",
                summary: "Auto, capital goods, and specialized manufacturing sectors remain in focus as companies report volume growth.",
                content: "As quarterly results roll in, market participants are closely tracking volume growth across domestic industrial and consumer segments.\n\n• Auto & Engineering: Strong two-wheeler and commercial vehicle demand continues to support ancillary manufacturers.\n• IT & Digital Services: Deal wins remain steady while management teams focus on operational efficiency."
            }
        ]/*ARTICLES_END*/;

        const homeView = document.getElementById('home-view');
        const articleView = document.getElementById('article-view');
        let currentCategory = 'All';

        function renderArticles(list) {
            homeView.innerHTML = '';
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openArticle(item.id);
                
                let imgHtml = item.imageUrl ? `<img src="${item.imageUrl}" class="card-img" alt="News Image">` : `<div class="card-img" style="background:#e5e5e5;"></div>`;

                card.innerHTML = `
                    ${imgHtml}
                    <div class="card-category">${item.category}</div>
                    <h2 class="card-title">${item.title}</h2>
                    <p class="card-summary">${item.summary}</p>
                    <div class="card-date">${item.date}</div>
                `;
                homeView.appendChild(card);
            });
        }

        function openArticle(id) {
            const item = articles.find(a => a.id === id);
            if (!item) return;
            
            document.getElementById('view-tag').innerText = item.category;
            document.getElementById('view-title').innerText = item.title;
            document.getElementById('view-meta').innerText = `Published on ${item.date}`;
            document.getElementById('view-content').innerText = item.content;

            const imgEl = document.getElementById('view-img');
            if(item.imageUrl) { imgEl.src = item.imageUrl; imgEl.style.display = 'block'; } 
            else { imgEl.style.display = 'none'; }

            homeView.style.display = 'none';
            articleView.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeArticle() {
            articleView.style.display = 'none';
            homeView.style.display = 'grid';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterArticles(category, btnElement) {
            currentCategory = category;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            closeArticle();
            const filtered = category === 'All' ? articles : articles.filter(a => a.category === category);
            renderArticles(filtered);
        }

        // Initialize
        renderArticles(articles);
    </script>
</body>
</html>
